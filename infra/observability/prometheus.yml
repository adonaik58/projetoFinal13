global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # API metrics (HTTP, runtime, business) arrive via OTLP and are exposed by the collector.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
