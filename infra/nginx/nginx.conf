# Edge proxy (nginx-unprivileged: runs as uid 101, listens on 8080/8443).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Reuse the caller's correlation id or mint one; forwarded to the API and logged.
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    log_format json escape=json '{"time":"$time_iso8601","correlation_id":"$correlation_id","remote_addr":"$remote_addr",'
                                '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                                '"duration":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
                                '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    # Same fields without the query string: the realtime hub receives the access token as ?access_token=.
    log_format json_no_query escape=json '{"time":"$time_iso8601","correlation_id":"$correlation_id","remote_addr":"$remote_addr",'
                                '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                                '"duration":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
                                '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/problem+json application/javascript text/css text/plain image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
