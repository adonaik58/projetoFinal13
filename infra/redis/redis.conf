# Redis is a cache/coordination layer only (cache, rate limiting, idempotency, login throttling).
# MySQL is the source of truth, so persistence is disabled and memory is bounded with LRU eviction.
bind 0.0.0.0
protected-mode yes
port 6379
save ""
appendonly no
maxmemory 256mb
maxmemory-policy allkeys-lru
tcp-keepalive 60
timeout 0
latency-monitor-threshold 100
