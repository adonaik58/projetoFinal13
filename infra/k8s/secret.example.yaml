# Template only — create the real Secret out of band (e.g. sealed-secrets / external-secrets), never commit it.
apiVersion: v1
kind: Secret
metadata:
  name: parking-api-secrets
  namespace: xyami-park
type: Opaque
stringData:
  ConnectionStrings__Database: "Server=<mysql-host>;Port=3306;Database=parking;User=parking_app;Password=<app-password>;Maximum Pool Size=50"
  ConnectionStrings__MigratorDatabase: "Server=<mysql-host>;Port=3306;Database=parking;User=parking;Password=<owner-password>"
  ConnectionStrings__Redis: "<redis-host>:6379,password=<redis-password>,ssl=true,abortConnect=false"
  Jwt__SigningKey: "<at-least-32-random-characters>"
  Bootstrap__AdminUsername: "admin"
  Bootstrap__AdminPassword: "<initial-admin-password>"
