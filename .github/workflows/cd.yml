name: CD

# main → staging (automatic); tag vX.Y.Z → production (requires approval on the "production" environment).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/xyami-park

jobs:
  images:
    name: Build & publish images
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; else echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: VERSION=${{ steps.tag.outputs.tag }}
          tags: ${{ env.IMAGE_PREFIX }}/api:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: true
          sbom: true
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: true
          sbom: true
      - name: Scan published images
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/api:${{ steps.tag.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy-staging:
    name: Deploy → staging
    needs: images
    if: github.ref == 'refs/heads/main' || inputs.environment == 'staging'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      tag: ${{ needs.images.outputs.tag }}
    secrets: inherit

  deploy-production:
    name: Deploy → production
    needs: [images, deploy-staging]
    if: always() && needs.images.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      tag: ${{ needs.images.outputs.tag }}
    secrets: inherit
