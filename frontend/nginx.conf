# Static SPA server (internal). TLS, security headers and /api proxying live in the edge proxy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Relative Location headers, so redirects keep the public scheme/host set by the edge proxy.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Legacy (PHP) URLs → new routes.
    location = /dashboard { return 301 /; }
    location = /home { return 301 /; }
    location = /gestor/users { return 301 /management/users; }
    location = /gestor/tickts-story { return 301 /tickets?status=Closed; }
    location = /gestor/table-prices { return 301 /tariff; }
    location = /gestor/promotion { return 301 /; }
    location = /settings { return 301 /management/settings; }

    # Fingerprinted build output: cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The HTML shell must always be revalidated so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
